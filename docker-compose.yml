# Postgres for the API. The backend falls back to SQLite when DATABASE_URL is
# unset, so this is optional during development.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense
      POSTGRES_DB: stocksense
    ports:
      - "5432:5432"
    volumes:
      - stocksense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stocksense_pgdata:
